name: Deploy to Azure Container Apps

# Manual and monthly rather than on every push: the deployment is a demonstration, and a
# monthly run shows within weeks when the cloud side has rotted.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/winterframework/winter-getting-started
  RESOURCE_GROUP: winter-getting-started
  CONTAINER_APP: winter-getting-started

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: azure
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build --tag "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        run: |
          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:$GITHUB_SHA" --output none
          fqdn=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: ./smoke_test.sh "${{ steps.deploy.outputs.url }}"

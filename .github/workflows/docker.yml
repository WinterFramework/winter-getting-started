name: docker
on: push

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag winter-getting-started .
      - name: Start container
        run: docker run --detach --name app --publish 8080:8080 winter-getting-started
      - name: Check that the app answers
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/greeting/
      - name: Container logs
        if: failure()
        run: docker logs app
